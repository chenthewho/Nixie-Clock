<script>
"use strict";
/* ==========================================================================
   谜底时钟 · 纯代码还原（Canvas 2D，零图片、零依赖、单文件）
   --------------------------------------------------------------------------
   设计空间固定 2507 x 1343（与参考图同尺寸），所有几何常量均由参考图逐像素
   测量得到；任意窗口尺寸下等比缩放并居中，因此始终与参考图 1:1。
   数字变化时按霓虹管（nixie）方式起辉：随机跳字抖动 → 过亮落定 → 常驻微闪。
   URL 参数：
     ?t=23:08:36   固定时间     ?d=10/10  固定日期    ?w=SATURDAY 固定星期
     ?static=1     关闭动画（逐像素比对用）
   ========================================================================== */

const DW = 2507, DH = 1343;

/* --------------------------- 几何常量（实测值） --------------------------- */
const GLASS = {
  halfW: 134,            // 玻璃外壁半宽（实测最宽 269/2）
  bodyTop: 520,
  bodyBot: 898,
  cornerR: 13,
  /* 颈部 + 肩部 + 顶部小球的外轮廓：(y, 半宽)，逐 4px 实测 */
  profile: [
    [398, 4.5], [402, 9.0], [406, 10.5], [412, 9.5], [418, 9.5],
    [422, 12.0], [426, 15.5], [430, 18.5], [434, 21.5], [438, 24.0],
    [442, 26.0], [446, 29.0], [450, 33.0], [454, 36.0], [458, 40.5],
    [462, 58.0], [466, 74.0], [470, 83.0], [474, 96.0], [478, 110.0],
    [482, 116.0], [486, 119.0], [490, 121.0], [494, 122.5], [498, 125.0],
    [502, 127.5], [506, 129.5], [510, 131.5], [514, 133.0], [518, 133.5],
    [520, 134.0],
  ],
  /* 极板：实测左 215 右 419（±102），上沿 522 下沿 884；网孔区 226..408 / 536..866 */
  plate: { x0: -102, x1: 102, y0: 522, y1: 884, meshX0: -91, meshX1: 91, meshY0: 536, meshY1: 866 },
  base:  { x0: -130, x1: 130, y0: 912, y1: 978 },
};
const TUBE_CX = [316, 644, 1085, 1413, 1855, 2182.5];
const SEP_CX  = [864.5, 1633.5];

const LAYER = { hw: 170, y0: 380, h: 620 };
const GLOW  = { hw: 160, y0: 495, h: 415 };

/* ------------------------------- 字形（矢量） ------------------------------ */
/* 每个数字 = 若干条“笔画中心线”，点坐标为 0..100 归一化盒内的实测骨架；
   弯折处用 Catmull-Rom 转三次贝塞尔平滑，直角处拆成独立子路径以保留锐角。 */
function catmullPath(pts, closed) {
  const p = new Path2D();
  const n = pts.length;
  const at = (i) => closed ? pts[(i % n + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  p.moveTo(pts[0][0], pts[0][1]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    p.bezierCurveTo(
      p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
      p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6,
      p2[0], p2[1]);
  }
  if (closed) p.closePath();
  return p;
}
function ellipsePath(cx, cy, rx, ry) {
  const pts = [];
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * Math.PI * 2 - Math.PI / 2;
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return catmullPath(pts, true);
}
function buildGlyph(def) {
  const p = new Path2D();
  for (const sub of def.sub) {
    const path = sub.e ? ellipsePath(sub.e[0], sub.e[1], sub.e[2], sub.e[3])
                        : catmullPath(sub.p, !!sub.closed);
    p.addPath(path);
  }
  return p;
}

/* 目标尺寸/中心：全部来自对参考图骨架的实测（六个数字高均 ≈300px） */
const GLYPH_DEF = {
  "0": { w: 151, h: 305, cy: 698, sub: [{ e: [50, 50, 49, 49] }] },
  "2": { w: 158, h: 305, cy: 693, sub: [
    { p: [[1,38],[2,24],[8,17],[18,10],[33,3],[50,0],[67,3],[83,10],[93,17],[99,24],[100,31],
          [98,38],[92,45],[82,52],[70,59],[56,66],[42,73],[28,80],[16,86],[7,92],[3,96]] },
    { p: [[3,97],[100,97]] } ] },
  "3": { w: 161, h: 296, cy: 708, sub: [
    { p: [[3,1],[50,1],[95,1],[54,33]] },
    { p: [[54,33],[62,38],[78,44],[92,51],[99,60],[100,68],[97,78],[89,86],[76,93],[60,99],
          [50,101],[30,97],[12,89],[0,79]] } ] },
  "6": { w: 159, h: 300, cy: 702, sub: [
    { p: [[50,0],[43,7],[36,13],[28,20],[22,27],[16,33],[12,40],[8,47],[8,53],[3,60],[0,67],
          [1,73],[4,80],[11,87],[25,93],[50,100],[77,93],[90,87],[96,80],[99,73],[100,67],
          [96,60],[89,53],[70,47],[45,44],[30,46]] } ] },
  "8": { w: 162, h: 303, cy: 704, sub: [
    { closed: true, p: [[50,1],[63,7],[80,13],[88,20],[90,26],[85,33],[72,40],[58,46],
                        [58,50],[42,50],[26,45],[17,38],[12,32],[13,26],[17,20],[25,13],[37,7]] },
    { closed: true, p: [[58,50],[70,53],[86,59],[97,66],[100,73],[98,80],[91,86],[76,92],
                        [50,100],[24,92],[9,86],[3,80],[0,73],[2,66],[13,59],[28,53],[42,50]] } ] },
  "1": { w: 62, h: 300, cy: 702, sub: [
    { p: [[28,20],[52,0],[52,99]] }, { p: [[22,99],[84,99]] } ] },
  "4": { w: 158, h: 300, cy: 704, sub: [
    { p: [[76,0],[4,68],[97,68]] }, { p: [[76,0],[76,100]] } ] },
  "5": { w: 155, h: 300, cy: 704, sub: [
    { p: [[93,2],[18,2],[13,45],[42,35],[70,37],[92,52],[95,72],[84,90],[58,99],[32,96],[10,86]] } ] },
  "7": { w: 160, h: 300, cy: 704, sub: [
    { p: [[4,4],[98,4],[40,100]] } ] },
  "9": { w: 159, h: 300, cy: 702, sub: [
    { p: [[50,100],[57,93],[64,87],[72,80],[78,73],[84,67],[88,60],[92,53],[92,47],[97,40],[100,33],
          [99,27],[96,20],[89,13],[75,7],[50,0],[23,7],[10,13],[4,20],[1,27],[0,33],
          [4,40],[11,47],[30,53],[55,56],[70,54]] } ] },
};
const GLYPHS = {}, GLYPH_BOX = {};
for (const k in GLYPH_DEF) GLYPHS[k] = buildGlyph(GLYPH_DEF[k]);
/* 启动时量出每条路径的中心线包围盒，用它把字形精确缩放到实测尺寸 */
(function () {
  const S = 4, PAD = 60, N = 100 * S + PAD * 2;
  const c = document.createElement("canvas");
  c.width = c.height = N;
  const g = c.getContext("2d");
  g.setTransform(S, 0, 0, S, PAD, PAD);
  g.lineWidth = 1 / S; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#fff";
  for (const k in GLYPHS) {
    g.clearRect(-PAD, -PAD, N, N);
    g.stroke(GLYPHS[k]);
    const d = g.getImageData(0, 0, N, N).data;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (d[(y * N + x) * 4 + 3] > 10) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    GLYPH_BOX[k] = { x0: (x0 - PAD) / S, y0: (y0 - PAD) / S, x1: (x1 - PAD) / S, y1: (y1 - PAD) / S };
  }
})();

/* --------------------------------- 参数 --------------------------------- */
const Q = new URLSearchParams(location.search);
const STATIC = Q.get("static") === "1";
const FIXED_T = Q.get("t"), FIXED_D = Q.get("d"), FIXED_W = Q.get("w");

/* -------------------------------- 画布 ---------------------------------- */
/* 全屏柔光：亮部降采样→模糊→加法叠回，让灯丝、玻璃边缘、金属件都不再“硬” */
const BLOOM = 0.55;
const bloomCv = document.createElement("canvas");
const bloomG = bloomCv.getContext("2d");

const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
let vs = 1, vox = 0, voy = 0, SS = 1, GS = 1;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = w + "px";
  cv.style.height = h + "px";
  const s = Math.min(w / DW, h / DH);
  vs = s * dpr;
  vox = (w * dpr - DW * vs) / 2;
  voy = (h * dpr - DH * vs) / 2;
  // 关键：离屏层按“设计单位 × 当前设备缩放”光栅化。
  // 若固定按设计分辨率渲染再缩小，细密网孔会被降采样成摩尔纹，看起来又硬又脏。
  SS = Math.min(2, Math.max(0.55, vs));
  GS = SS;
  bloomCv.width = Math.max(1, Math.round(cv.width / 4));
  bloomCv.height = Math.max(1, Math.round(cv.height / 4));
  buildPatterns();
  buildGlowCanvas();
  buildTubeLayers();
}

/* ------------------------------ 蜂窝网图案 ------------------------------- */
/* 实测：孔距 ≈ 11.6px，孔径 ≈ 0.58 倍孔距 */
const MESH = { pitch: 10.2, hole: 0.62, r: 0.46 };

let holePat = null;

function makePattern(webColor, holeColor) {
  // 每个图案 tile 直接按设备像素大小生成：缩放后不会产生摩尔纹
  const t = Math.max(4, Math.round(MESH.pitch * vs));
  const c = document.createElement("canvas");
  c.width = c.height = t;
  const g = c.getContext("2d");
  if (webColor) { g.fillStyle = webColor; g.fillRect(0, 0, t, t); }
  // 圆角方孔 + 轻微模糊：孔径约为孔距的 0.62，边缘柔化以贴近实拍金属网
  const hs = t * MESH.hole, r = hs * MESH.r, o = (t - hs) / 2;
  g.filter = `blur(${Math.max(0.45, t * 0.07)}px)`;
  g.fillStyle = holeColor;
  g.beginPath();
  g.moveTo(o + r, o);
  g.arcTo(o + hs, o, o + hs, o + hs, r);
  g.arcTo(o + hs, o + hs, o, o + hs, r);
  g.arcTo(o, o + hs, o, o, r);
  g.arcTo(o, o, o + hs, o, r);
  g.closePath();
  g.fill();
  g.filter = "none";
  const p = ctx.createPattern(c, "repeat");
  p.setTransform(new DOMMatrix().scale(1 / (t / MESH.pitch)));
  return p;
}
function buildPatterns() {
  // 乘法网：网线为白（不改变亮度），孔洞压暗 → 发光透过时孔比网暗
  holePat = makePattern(null, "rgba(0,0,0,0.74)");   // 网线透明 + 孔洞压暗
}

/* ------------------------------- 路径工具 -------------------------------- */
function glassPath(cx) {
  const G = GLASS, r = G.cornerR, bot = G.bodyBot;
  const p = new Path2D();
  p.moveTo(cx - G.profile[0][1], G.profile[0][0]);
  // 左半轮廓（颈部→肩部）
  for (const [y, hw] of G.profile) p.lineTo(cx - hw, y);
  // 直筒段（略微内收）
  p.lineTo(cx - 133.5, bot - 40);
  p.lineTo(cx - 133, bot - r);
  p.quadraticCurveTo(cx - 132.5, bot + 12, cx - 118, bot + 12);
  p.lineTo(cx + 118, bot + 12);
  p.quadraticCurveTo(cx + 132.5, bot + 12, cx + 133, bot - r);
  p.lineTo(cx + 133.5, bot - 40);
  // 右半轮廓（肩部→颈部，反向）
  for (let i = G.profile.length - 1; i >= 0; i--) p.lineTo(cx + G.profile[i][1], G.profile[i][0]);
  p.closePath();
  return p;
}
function digitPath(d, cx) {
  const t = GLYPH_DEF[d] || GLYPH_DEF["0"];
  const b = GLYPH_BOX[d] || GLYPH_BOX["0"];
  const bw = Math.max(1e-3, b.x1 - b.x0), bh = Math.max(1e-3, b.y1 - b.y0);
  const m = new DOMMatrix()
    .translate(cx, t.cy)
    .scale(t.w / bw, t.h / bh)
    .translate(-(b.x0 + b.x1) / 2, -(b.y0 + b.y1) / 2);
  const p = new Path2D();
  p.addPath(GLYPHS[d] || GLYPHS["0"], m);
  return p;
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* --------------------------- 每只管子的静态层 ---------------------------- */
const tubeLayers = TUBE_CX.map(() => ({}));

function buildTubeLayers() {
  TUBE_CX.forEach((cx, i) => {
    const ss = SS;
    const mk = () => {
      const c = document.createElement("canvas");
      c.width = Math.round(LAYER.hw * 2 * ss);
      c.height = Math.round(LAYER.h * ss);
      const g = c.getContext("2d");
      g.setTransform(ss, 0, 0, ss, -(cx - LAYER.hw) * ss, -LAYER.y0 * ss);
      return [c, g];
    };
    const [under, gu] = mk(), [over, go] = mk();
    drawUnder(gu, cx);
    drawOver(go, cx);
    tubeLayers[i] = { under, over };
  });
}

/* 底层：底座 / 玻璃暗腔 / 极板 + 金属框 + 蜂窝网 */
function drawUnder(g, cx) {
  const G = GLASS, B = G.base, P = G.plate;

  /* ---- 底座：实测是一整块 260x66 的暗板，中央一道暗缝、两侧各有亮区 ---- */
  const bw = B.x1 - B.x0;
  const bg = g.createLinearGradient(cx + B.x0, 0, cx + B.x1, 0);
  // (相对中心的偏移, 亮度) —— 直接来自参考图横向剖面
  const prof = [[-130,2],[-124,2],[-116,6],[-108,11],[-100,17],[-92,20],[-84,24],[-76,23],
                [-68,23],[-60,23],[-52,20],[-44,18],[-36,15],[-28,14],[-20,11],[-12,10],
                [-4,8],[4,4],[12,7],[20,10],[28,14],[36,17],[44,21],[52,24],[60,28],[68,26],
                [76,24],[84,21],[92,18],[100,15],[108,11],[116,10],[124,5],[130,3]];
  for (const [dx, v] of prof) {
    const t = (dx - B.x0) / bw;
    bg.addColorStop(Math.min(1, Math.max(0, t)), `rgb(${v},${v},${v + 2})`);
  }
  g.save();
  g.filter = "blur(1.6px)";                 // 底座边缘同样羽化
  g.fillStyle = bg;
  g.fillRect(cx + B.x0, B.y0, bw, B.y1 - B.y0);
  g.restore();
  // 上下边缘各 3px 过渡，避免出现硬直角“塑料块”
  const fadeT = g.createLinearGradient(0, B.y0 - 4, 0, B.y0 + 4);
  fadeT.addColorStop(0, "rgba(0,0,0,1)"); fadeT.addColorStop(0.5, "rgba(0,0,0,0.35)"); fadeT.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = fadeT; g.fillRect(cx + B.x0, B.y0 - 4, bw, 8);
  const fadeB = g.createLinearGradient(0, B.y1 - 4, 0, B.y1 + 4);
  fadeB.addColorStop(0, "rgba(0,0,0,0)"); fadeB.addColorStop(0.5, "rgba(0,0,0,0.35)"); fadeB.addColorStop(1, "rgba(0,0,0,1)");
  g.fillStyle = fadeB; g.fillRect(cx + B.x0, B.y1 - 4, bw, 8);

  /* ---- 玻璃内腔 ---- */
  const gp = glassPath(cx);
  g.save();
  g.clip(gp);
  const ig = g.createLinearGradient(cx - G.halfW, 0, cx + G.halfW, 0);
  ig.addColorStop(0.00, "#2f2a24");
  ig.addColorStop(0.10, "#201d1a");
  ig.addColorStop(0.35, "#0c0c0c");
  ig.addColorStop(0.72, "#080808");
  ig.addColorStop(1.00, "#050505");
  g.fillStyle = ig;
  g.fillRect(cx - G.halfW, 380, G.halfW * 2, 620);
  // 内腔整体“上亮下暗”（实测 560 行 ~75，850 行 ~22）
  const vg0 = g.createLinearGradient(0, 500, 0, 910);
  vg0.addColorStop(0, "rgba(0,0,0,0)");
  vg0.addColorStop(0.35, "rgba(0,0,0,0.18)");
  vg0.addColorStop(0.72, "rgba(0,0,0,0.45)");
  vg0.addColorStop(1, "rgba(0,0,0,0.60)");
  g.fillStyle = vg0;
  g.fillRect(cx - G.halfW, 500, G.halfW * 2, 410);
  // 穹顶压暗
  const tg = g.createLinearGradient(0, 420, 0, 545);
  tg.addColorStop(0, "rgba(0,0,0,0.68)");
  tg.addColorStop(0.55, "rgba(0,0,0,0.34)");
  tg.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = tg;
  g.fillRect(cx - G.halfW, 396, G.halfW * 2, 150);

  /* ---- 极板 ---- */
  const x0 = cx + P.x0, x1 = cx + P.x1;
  // 金属框：左右压条按实测（左峰 126 / 右峰 103），上下压条约 50~80
  const fg = g.createLinearGradient(x0, 0, x1, 0);
  fg.addColorStop(0.000, "rgb(78,76,72)");
  fg.addColorStop(0.035, "rgb(98,96,92)");
  fg.addColorStop(0.055, "rgb(104,102,97)");
  fg.addColorStop(0.080, "rgb(56,54,52)");
  fg.addColorStop(0.500, "rgb(47,45,43)");
  fg.addColorStop(0.925, "rgb(53,51,49)");
  fg.addColorStop(0.955, "rgb(84,82,78)");
  fg.addColorStop(0.980, "rgb(68,66,63)");
  fg.addColorStop(1.000, "rgb(34,32,30)");
  g.save();
  g.filter = "blur(1.1px)";                 // 框边羽化，避免“画框”般的硬直角
  g.fillStyle = fg;
  g.fillRect(x0, P.y0, x1 - x0, P.y1 - P.y0);
  g.restore();
  // 网孔区底色（暖灰）
  const mg = g.createLinearGradient(0, P.y0, 0, P.y1);
  mg.addColorStop(0, "#29251f");
  mg.addColorStop(0.4, "#2d2822");
  mg.addColorStop(1, "#262220");
  g.fillStyle = mg;
  g.fillRect(cx + P.meshX0, P.meshY0, P.meshX1 - P.meshX0, P.meshY1 - P.meshY0);
  g.restore();
}

function pin(g, x, y) {
  g.save();
  g.beginPath(); g.arc(x, y, 14.5, 0, 7);
  g.fillStyle = "rgba(74,58,16,0.95)"; g.fill();
  g.beginPath(); g.arc(x, y, 11, 0, 7);
  g.fillStyle = "rgba(38,29,8,0.95)"; g.fill();
  g.beginPath(); g.arc(x, y, 15, 0, 7);
  g.strokeStyle = "rgba(126,106,45,0.42)"; g.lineWidth = 1.6; g.stroke();
  g.beginPath(); g.arc(x, y - 1.5, 7.5, 0, 7);
  g.fillStyle = "rgba(30,23,6,0.9)"; g.fill();
  g.restore();
}

/* 顶层：玻璃反光 / 边缘 / 颈部高光 */
function drawOver(g, cx) {
  const G = GLASS, hw = G.halfW;
  g.save();
  g.clip(glassPath(cx));

  /* 左内壁反光：实测峰值在 cx-128、宽约 10px，向内 20px 内衰减到 0 */
  g.save();
  g.globalCompositeOperation = "lighter";
  // 实测：玻璃最外沿是暗的（~6），亮线在 cx-127 处（~106），向内 9px 落到 ~46 并保持
  const rim = g.createLinearGradient(cx - 133, 0, cx - 100, 0);
  rim.addColorStop(0.00, "rgba(255,244,220,0)");
  rim.addColorStop(0.13, "rgba(255,244,220,0.02)");
  rim.addColorStop(0.17, "rgba(255,240,212,0.34)");
  rim.addColorStop(0.21, "rgba(255,238,205,0.44)");   // 峰值 ≈ cx-126
  rim.addColorStop(0.30, "rgba(245,232,200,0.26)");
  rim.addColorStop(0.50, "rgba(220,210,186,0.10)");
  rim.addColorStop(0.80, "rgba(200,192,176,0.03)");
  rim.addColorStop(1.00, "rgba(190,184,172,0)");
  g.fillStyle = rim;
  g.fillRect(cx - 134, 452, 34, 460);
  // 底部渐隐（实测 850 行仍亮，890 行转暗）
  const fade = g.createLinearGradient(0, 452, 0, 912);
  fade.addColorStop(0, "rgba(0,0,0,0.58)");
  fade.addColorStop(0.22, "rgba(0,0,0,0.18)");
  fade.addColorStop(0.45, "rgba(0,0,0,0.02)");
  fade.addColorStop(0.78, "rgba(0,0,0,0.14)");
  fade.addColorStop(1, "rgba(0,0,0,0.42)");
  g.globalCompositeOperation = "source-atop";
  g.fillStyle = fade;
  g.fillRect(cx - 134, 452, 34, 460);
  g.restore();

  /* 右内壁：极弱的一条细边（实测 448 处 ~20） */
  g.save();
  g.globalCompositeOperation = "lighter";
  const rg = g.createLinearGradient(cx + hw - 12, 0, cx + hw, 0);
  rg.addColorStop(0, "rgba(150,150,155,0)");
  rg.addColorStop(1, "rgba(150,150,158,0.10)");
  g.fillStyle = rg;
  g.fillRect(cx + hw - 12, 452, 12, 460);
  g.restore();

  /* 穹顶：左肩大面积冷灰漫反射（实测中心 ~(cx-70, 500)，峰值 ~(83,82,94)） */
  g.save();
  g.globalCompositeOperation = "lighter";
  const blob = g.createRadialGradient(cx - 68, 498, 2, cx - 68, 498, 40);
  blob.addColorStop(0, "rgba(152,158,186,0.46)");
  blob.addColorStop(0.35, "rgba(122,128,150,0.22)");
  blob.addColorStop(0.7, "rgba(94,98,114,0.05)");
  blob.addColorStop(1, "rgba(84,88,102,0)");
  g.fillStyle = blob;
  g.beginPath(); g.arc(cx - 68, 498, 40, 0, 7); g.fill();

  // 肩部上缘的细高光弧
  g.filter = "blur(2.5px)";
  g.beginPath();
  g.moveTo(cx - 100, 526);
  g.bezierCurveTo(cx - 108, 492, cx - 84, 470, cx - 46, 459);
  g.strokeStyle = "rgba(255,255,255,0.16)";
  g.lineWidth = 6; g.lineCap = "round"; g.stroke();
  g.filter = "none";
  g.beginPath();
  g.moveTo(cx - 97, 523);
  g.bezierCurveTo(cx - 104, 492, cx - 82, 472, cx - 48, 462);
  g.strokeStyle = "rgba(255,255,255,0.22)";
  g.lineWidth = 2.6; g.stroke();

  /* 颈部与顶部小球：玻璃厚度带来的灰调（实测颈中 ~45、颈下 ~25、球 ~30） */
  const nk = g.createLinearGradient(0, 396, 0, 480);
  nk.addColorStop(0.00, "rgba(140,140,146,0.12)");
  nk.addColorStop(0.22, "rgba(150,150,156,0.15)");
  nk.addColorStop(0.45, "rgba(150,150,156,0.11)");
  nk.addColorStop(0.72, "rgba(150,150,156,0.05)");
  nk.addColorStop(1.00, "rgba(150,150,156,0)");
  g.fillStyle = nk;
  g.fillRect(cx - 60, 396, 120, 84);

  /* 颈部锥面的左侧镜面高光（实测 y=435 x≈cx-20 亮度 113，y=445 x≈cx-23 亮度 131） */
  g.beginPath();
  g.moveTo(cx - 25, 456);
  g.bezierCurveTo(cx - 23, 444, cx - 20, 434, cx - 13, 426);
  g.strokeStyle = "rgba(255,244,222,0.20)";
  g.lineWidth = 7; g.lineCap = "round";
  g.filter = "blur(2px)"; g.stroke();
  g.filter = "none";
  g.beginPath();
  g.moveTo(cx - 24, 454);
  g.bezierCurveTo(cx - 22, 443, cx - 19, 434, cx - 14, 427);
  g.strokeStyle = "rgba(255,250,236,0.42)";
  g.lineWidth = 2.4; g.stroke();

  /* 顶部小球：左侧边缘光 + 顶端弧光 */
  g.beginPath();
  g.moveTo(cx - 9.0, 416);
  g.lineTo(cx - 8.0, 403);
  g.strokeStyle = "rgba(240,238,234,0.22)";
  g.lineWidth = 2.8; g.lineCap = "round"; g.stroke();
  g.beginPath();
  g.arc(cx, 408, 9.5, Math.PI * 1.15, Math.PI * 1.85);
  g.strokeStyle = "rgba(255,252,244,0.18)";
  g.lineWidth = 2.0; g.stroke();

  /* 穹顶外缘的暖色反光（灯丝在玻璃内壁的反射） */
  const wm = g.createRadialGradient(cx - 6, 560, 10, cx - 6, 560, 190);
  wm.addColorStop(0, "rgba(255,116,18,0.055)");
  wm.addColorStop(0.6, "rgba(255,100,10,0.02)");
  wm.addColorStop(1, "rgba(255,90,0,0)");
  g.fillStyle = wm;
  g.fillRect(cx - 140, 470, 200, 330);
  g.restore();

  /* 玻璃厚度感：右侧压暗 */
  const sh = g.createLinearGradient(cx - hw, 0, cx + hw, 0);
  sh.addColorStop(0, "rgba(0,0,0,0)");
  sh.addColorStop(0.45, "rgba(0,0,0,0.05)");
  sh.addColorStop(1, "rgba(0,0,0,0.14)");
  g.fillStyle = sh;
  g.fillRect(cx - hw, 380, hw * 2, 620);

  g.restore();
}

/* ------------------------------- 辉光渲染 -------------------------------- */
/* 目标：与参考图一致——芯部 ≈ rgb(233,165,16)，半高宽 ≈ 16px，外扩橙色光晕 */
const glowCv = document.createElement("canvas");
const gg = glowCv.getContext("2d");
function buildGlowCanvas() {
  glowCv.width = Math.round(GLOW.hw * 2 * GS);
  glowCv.height = Math.round(GLOW.h * GS);
}

function drawGlow(cx, d, inten) {
  gg.setTransform(GS, 0, 0, GS, -(cx - GLOW.hw) * GS, -GLOW.y0 * GS);
  gg.globalCompositeOperation = "source-over";
  gg.globalAlpha = 1;
  gg.clearRect(cx - GLOW.hw, GLOW.y0, GLOW.hw * 2, GLOW.h);

  const p = digitPath(d, cx);
  gg.lineCap = "round";
  gg.lineJoin = "round";

  // 灯丝 = 一条窄笔芯，外扩柔光由“同一笔芯的逐级模糊副本”加法叠加而成。
  // 注意：必须用 lighter 累加；若用更宽的实色描边打底，会在亮芯外留下一圈暗环。
  gg.globalCompositeOperation = "lighter";
  gg.globalAlpha = Math.max(0, Math.min(1, inten));        // 起辉抖动 / 常驻微闪
  const k = inten > 1 ? Math.min(1.9, inten) : 1;          // 落定瞬间的过亮
  const col = (r, g, b) =>
    `rgb(${Math.min(255, Math.round(r * k))},${Math.min(255, Math.round(g * k))},${Math.min(255, Math.round(b * k))})`;
  // 每档的数值就是它在该半径处的“加法贡献”，逐档收窄 → 亮度自然递减
  const passes = [
    [2,  col(84, 55, 2)],           // 灯丝本体（也做轻微模糊，避免硬边）
    [5,  col(54, 31, 0)],
    [10, col(34, 18, 0)],
    [20, col(25, 12, 0)],
    [40, col(16, 7, 0)],
    [76, col(17, 8, 0)],
    [130, col(13, 6, 0)],           // 宽层：把管内填成暖色（参考图的“光晕罩”感）
    [210, col(8, 4, 0)],            // 最宽一层，均匀托底
  ];
  gg.lineWidth = 12;
  for (const [blur, c] of passes) {
    gg.filter = blur ? `blur(${blur}px)` : "none";
    gg.strokeStyle = c;
    gg.stroke(p);
  }
  gg.filter = "none";
  gg.globalAlpha = 1;
}

/* ------------------------------- 分隔灯 --------------------------------- */
function drawSeparator(g, cx, pulse) {
  const L1 = { top: 664, bot: 750, cy: 706 }, L2 = { top: 784, bot: 880, cy: 840 };
  const hw = 28;

  /* 底座 */
  roundRect(g, cx - 24, 940, 48, 38, 7);
  const bg = g.createLinearGradient(0, 940, 0, 978);
  bg.addColorStop(0, "#0a0a0b"); bg.addColorStop(1, "#030304");
  g.fillStyle = bg; g.fill();

  /* 两根细灯杆 */
  g.strokeStyle = "rgba(44,42,40,0.9)";
  g.lineWidth = 2.0;
  for (const dx of [-3.6, 3.6]) {
    g.beginPath();
    g.moveTo(cx + dx, L1.bot - 10); g.lineTo(cx + dx, L2.top + 12);
    g.moveTo(cx + dx, L2.bot - 10); g.lineTo(cx + dx, 944);
    g.stroke();
  }

  for (const L of [L1, L2]) {
    const shell = new Path2D();
    shell.moveTo(cx - hw, L.bot - 16);
    shell.lineTo(cx - hw, L.top + 26);                       // 直壁
    shell.bezierCurveTo(cx - hw, L.top + 16, cx - 17, L.top + 12, cx - 9, L.top + 4);  // 顶尖锥
    shell.bezierCurveTo(cx - 5, L.top - 3, cx + 5, L.top - 3, cx + 9, L.top + 4);
    shell.bezierCurveTo(cx + 17, L.top + 12, cx + hw, L.top + 16, cx + hw, L.top + 26);
    shell.lineTo(cx + hw, L.bot - 16);
    shell.bezierCurveTo(cx + hw, L.bot - 4, cx + 14, L.bot + 2, cx + 6, L.bot + 2);   // 底部收细
    shell.bezierCurveTo(cx - 6, L.bot + 2, cx - hw, L.bot - 4, cx - hw, L.bot - 16);
    shell.closePath();

    g.save();
    g.clip(shell);
    const cg = g.createLinearGradient(0, L.top - 10, 0, L.bot);
    cg.addColorStop(0, "#170a04");
    cg.addColorStop(0.45, "#22100a");
    cg.addColorStop(1, "#0c0503");
    g.fillStyle = cg; g.fillRect(cx - hw, L.top - 14, hw * 2, L.bot - L.top + 22);

    // 灯芯
    g.globalCompositeOperation = "lighter";
    g.filter = "blur(6px)";
    const hg = g.createRadialGradient(cx, L.cy, 2, cx, L.cy, 27);
    hg.addColorStop(0, `rgba(214,150,8,${0.42 * pulse})`);
    hg.addColorStop(0.5, `rgba(170,105,5,${0.22 * pulse})`);
    hg.addColorStop(1, "rgba(130,70,0,0)");
    g.fillStyle = hg;
    g.beginPath(); g.ellipse(cx, L.cy, 25, 31, 0, 0, 7); g.fill();
    g.filter = "none";
    g.beginPath(); g.ellipse(cx, L.cy, 9.5, 16.5, 0, 0, 7);
    g.fillStyle = `rgba(196,124,4,${0.80 * pulse})`; g.fill();
    g.beginPath(); g.ellipse(cx, L.cy, 7, 13, 0, 0, 7);
    g.fillStyle = `rgba(226,158,6,${0.88 * pulse})`; g.fill();
    g.beginPath(); g.ellipse(cx, L.cy - 1, 4, 8, 0, 0, 7);
    g.fillStyle = `rgba(244,186,14,${0.80 * pulse})`; g.fill();
    g.globalCompositeOperation = "source-over";

    // 玻璃壳细反光
    g.globalCompositeOperation = "lighter";
    g.fillStyle = "rgba(255,246,228,0.085)";
    g.fillRect(cx - hw + 2, L.top + 4, 3, L.bot - L.top - 12);
    g.fillStyle = "rgba(255,246,228,0.055)";
    g.fillRect(cx + hw - 6, L.top + 8, 2, L.bot - L.top - 18);
    g.restore();
  }
}

/* ------------------------------ 日期文本 -------------------------------- */
const FONT = '"Oswald", "Helvetica Neue Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Helvetica, Arial, sans-serif';
let S_DATE = 0.66, S_DAY = 0.56;
const FS = 66;
function initFont() {
  ctx.save();
  ctx.font = `bold ${FS}px ${FONT}`;
  S_DATE = 44.4 / ctx.measureText("10").width;       // 参考图 “10” 实测宽 40（含描边补偿）
  S_DAY = 222 / ctx.measureText("SATURDAY").width;   // 参考图 “SATURDAY” 实测宽 222
  ctx.restore();
}
/* "M/D" 中的斜杠比系统字体更宽更斜，按参考图单独画，其余字符按压缩系数绘制 */
function drawDateRun(g, parts, x, baseY) {
  const slashW = 27, slashGap = 6.5, capH = 52;
  for (let i = 0; i < parts.length; i++) {
    const w = g.measureText(parts[i]).width * S_DATE;
    g.save();
    g.translate(x, 0); g.scale(S_DATE, 1);
    g.fillText(parts[i], 0, baseY); g.strokeText(parts[i], 0, baseY);
    g.restore();
    x += w;
    if (i < parts.length - 1) {
      g.save();
      g.lineCap = "butt";
      g.lineWidth = 9;
      g.beginPath();
      g.moveTo(x + slashGap, baseY);
      g.lineTo(x + slashGap + 19, baseY - capH);
      g.stroke();
      g.restore();
      x += slashW + 5;
    }
  }
  return x;
}
function drawDate(g, dateStr, dayStr) {
  const baseY = 300, gap = 54, slashW = 32;
  g.save();
  g.font = `bold ${FS}px ${FONT}`;
  g.fillStyle = "rgb(78,76,70)";
  g.strokeStyle = "rgb(78,76,70)";
  g.lineWidth = 1.2; g.lineJoin = "round";
  g.textBaseline = "alphabetic";
  const parts = dateStr.split("/");
  let w1 = 0;
  for (const p of parts) w1 += g.measureText(p).width * S_DATE;
  w1 += (parts.length - 1) * (slashW + 5.5);
  const w2 = g.measureText(dayStr).width * S_DAY;
  let x = 1251 - (w1 + gap + w2) / 2;
  x = drawDateRun(g, parts, x, baseY);
  x += gap;
  g.save();
  g.translate(x, 0); g.scale(S_DAY, 1);
  g.fillText(dayStr, 0, baseY); g.strokeText(dayStr, 0, baseY);
  g.restore();
  g.restore();
}

/* ------------------------------- 时钟状态 ------------------------------- */
const DAYS = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
const tubes = TUBE_CX.map((_, i) => ({
  cur: "0", to: "0", t: 9, dur: 0.26, seed: Math.random() * 97 + i * 13,
  walk: 0,                                  // 平滑随机游走（缓慢忽明忽暗）
  drop: 0,                                  // 正在闪断的剩余时间
  nextDrop: 0.6 + Math.random() * 3.2,      // 下次闪断倒计时
}));
function digitsOf(str) {
  for (let i = 0; i < 6; i++) {
    const d = str[i], st = tubes[i];
    if (st.to !== d) {
      st.cur = st.to; st.to = d; st.t = 0;
      st.dur = STATIC ? 0 : 0.22 + Math.random() * 0.10;
    }
  }
}
let dateStr = "10/10", dayStr = "SATURDAY";
function nowStrings() {
  const d = new Date(), p2 = (n) => String(n).padStart(2, "0");
  return {
    time: `${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`,
    date: `${d.getMonth() + 1}/${d.getDate()}`,
    day: DAYS[d.getDay()],
  };
}
function applyFixed() {
  if (FIXED_T) {
    const parts = FIXED_T.split(":").map((v) => String(parseInt(v, 10) || 0).padStart(2, "0"));
    while (parts.length < 3) parts.push("00");
    digitsOf(parts.join(""));
  }
  if (FIXED_D) dateStr = FIXED_D;
  if (FIXED_W) dayStr = FIXED_W.toUpperCase();
}

/* -------------------------------- 主循环 -------------------------------- */
let last = performance.now(), clockAcc = 1;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const T = now / 1000;

  if (!STATIC) {
    clockAcc += dt;
    if (clockAcc >= 0.25) {
      clockAcc = 0;
      const s = nowStrings();
      digitsOf(s.time);
      if (!FIXED_D) dateStr = s.date;
      if (!FIXED_W) dayStr = s.day;
    }
    for (const st of tubes) {
      st.t += dt;
      // 缓慢的明暗漂移：随机游走 + 回归
      st.walk += (Math.random() - 0.5) * 0.55;
      st.walk *= 0.90;
      // 偶发闪断（灯管“饿一下”的观感）
      st.nextDrop -= dt;
      if (st.drop <= 0 && st.nextDrop <= 0) {
        st.drop = 0.035 + Math.random() * 0.09;
        st.nextDrop = 0.7 + Math.random() * 3.6;
      }
      if (st.drop > 0) st.drop = Math.max(0, st.drop - dt);
    }
  } else {
    for (const st of tubes) st.t = 9;
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(vs, 0, 0, vs, vox, voy);

  const pulse = STATIC ? 1 : 0.93 + 0.07 * Math.sin(T * 2.1) + 0.02 * Math.sin(T * 17);
  for (const cx of SEP_CX) drawSeparator(ctx, cx, Math.max(0.78, pulse));

  for (let i = 0; i < 6; i++) {
    const cx = TUBE_CX[i], st = tubes[i];
    let d = st.to, inten = 1;

    if (st.t < st.dur) {
      const k = st.t / st.dur;
      if (k < 0.62) {                        // 起辉抖动：随机跳字
        const step = Math.floor(st.t / 0.032);
        const r = Math.abs(Math.sin((step + 1) * 12.9898 + st.seed) * 43758.5453) % 1;
        d = r < 0.45 ? String(Math.floor(r * 10)) : (r < 0.7 ? st.cur : st.to);
        inten = 0.32 + 0.5 * Math.abs(Math.sin(step * 2.7 + st.seed));
      } else {                               // 落定：先过亮再回落
        const k2 = (k - 0.62) / 0.38;
        d = st.to;
        inten = 1 + 0.5 * Math.pow(1 - k2, 2);
      }
    } else if (!STATIC) {
      // 常驻：缓慢忽明忽暗 + 极快微颤
      inten = 1 + st.walk * 0.075;
      inten *= 0.985 + 0.015 * Math.sin(T * 31 + st.seed) * Math.sin(T * 7.3 + st.seed);
      if (st.drop > 0) inten *= 0.42 + 0.38 * Math.random();   // 闪断瞬间忽明忽暗
    }

    drawGlow(cx, d, inten);

    const L = tubeLayers[i];
    ctx.drawImage(L.under, cx - LAYER.hw, LAYER.y0, LAYER.hw * 2, LAYER.h);

    // 阳极网：先把孔洞压暗（孔暗、网亮），再叠加辉光。
    // 辉光是灯丝自身发出的光（在阳极网前方），不参与压暗，因此亮处自然平滑
    ctx.save();
    const P = GLASS.plate;
    const mx0 = cx + P.meshX0, my0 = P.meshY0;
    const mw = P.meshX1 - P.meshX0, mh = P.meshY1 - P.meshY0;
    ctx.beginPath();
    ctx.rect(mx0, my0, mw, mh);
    ctx.clip();
    ctx.fillStyle = holePat;
    ctx.fillRect(mx0, my0, mw, mh);
    ctx.restore();

    ctx.save();
    ctx.clip(glassPath(cx));
    ctx.globalCompositeOperation = "lighter";
    ctx.drawImage(glowCv, cx - GLOW.hw, GLOW.y0, GLOW.hw * 2, GLOW.h);
    ctx.restore();

    ctx.drawImage(L.over, cx - LAYER.hw, LAYER.y0, LAYER.hw * 2, LAYER.h);
  }

  drawDate(ctx, dateStr, dayStr);

  // ── 柔光合成：整幅画面降采样 1/4 并模糊，再加法叠回 ──
  if (BLOOM > 0) {
    const bw = bloomCv.width, bh = bloomCv.height;
    bloomG.setTransform(1, 0, 0, 1, 0, 0);
    bloomG.globalCompositeOperation = "source-over";
    bloomG.globalAlpha = 1;
    bloomG.clearRect(0, 0, bw, bh);
    bloomG.filter = "none";
    bloomG.drawImage(cv, 0, 0, bw, bh);
    // 自乘一次：暗部被压到接近 0，只留灯丝/高光参与柔光，背景仍是纯黑
    bloomG.globalCompositeOperation = "multiply";
    bloomG.drawImage(bloomCv, 0, 0, bw, bh);
    bloomG.globalCompositeOperation = "source-over";
    bloomG.filter = "blur(1.8px)";
    bloomG.drawImage(bloomCv, 0, 0, bw, bh);
    bloomG.filter = "none";
    // 再叠一层更宽、更弱的柔光（不做平方）：给玻璃高光加“光泽”，纯黑处仍是 0
    bloomG.globalAlpha = 0.10;
    bloomG.filter = "blur(7px)";
    bloomG.drawImage(cv, 0, 0, bw, bh);
    bloomG.filter = "none";
    bloomG.globalAlpha = 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = BLOOM;
    ctx.drawImage(bloomCv, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }
  requestAnimationFrame(tick);
}

/* --------------------------------- 启动 --------------------------------- */
window.addEventListener("resize", resize);
resize();
initFont();
applyFixed();
if (!FIXED_T) {
  const s = nowStrings();
  digitsOf(s.time);
  if (!FIXED_D) dateStr = s.date;
  if (!FIXED_W) dayStr = s.day;
}
requestAnimationFrame(tick);
</script>
</body>
</html>
