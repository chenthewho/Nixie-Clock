<script>
"use strict";
/* ==========================================================================
   辉光管时钟 —— 依据 pen 设计稿《时钟.pen》还原
   --------------------------------------------------------------------------
   设计空间固定 1920 × 1080（与设计稿一致）；尺寸、颜色、圆角、渐变停靠点、
   字体全部直接取自设计文件。设计稿里的四个 GLSL 着色器已逐行移植：
     glow.glsl     → 径向渐变，falloff = pow(1-d, u_falloff)，叠加闪烁项
     mesh.glsl     → 逐像素六边形线框（边线 + 芯线 + 暗角）
     glass-v2.glsl → 轮廓边缘光 + 高斯高光带 + 壁厚柔光 + 管内反射
     ambient.glsl  → 环境暖光晕 + 底色 + 暗角 + 颗粒
   功能：跟随系统时间、数字起辉跳动、每只管独立忽明忽暗、可安装为 PWA。
   ========================================================================== */

/* ------------------------- 设计稿常量（勿随意改） ------------------------- */
const DESIGN = {
  W: 1920, H: 1080, bg: "#0A0705",
  ambient: { warm: [255, 138, 43], strength: 0.20, base: 0.022, centerY: 0.47 },
  date: { y: 132, gap: 20, fill: "#A08669", dotFill: "#4A3A2C", dotSize: 6, fontSize: 24, spacing: 8 },
  clock: { y: 330, h: 450, gap: 16 },
  pool: { x: 290, y: 700, w: 1340, h: 200, color: [255, 138, 43], intensity: 0.30, falloff: 1.9, flicker: 0.12, seed: 5 },
  tube: {
    w: 230, h: 450,
    halo: { color: [255, 122, 26], intensity: 0.38, falloff: 2.6, flicker: 0.16, seed: 0 },
    body: {
      x: 20, y: -32, w: 190, h: 412,
      grad: [[0, "#241C16"], [0.1, "#120C08"], [0.28, "#070504"], [0.72, "#050403"], [1, "#0C0806"]],
      inner: { color: "rgba(0,0,0,0.66)", blur: 34 },
    },
    frame: { x: 20, y: 0, w: 190, h: 380, radius: [95, 95, 16, 16], stroke: "rgba(255,255,255,0.122)", strokeWidth: 1.5 },
    mesh: { x: 36, y: 34, w: 158, h: 296, cell: 5.5, wire: 1.05, gain: 0.8, vig: 0.85, color: [255, 154, 60], radius: 3 },
    digit: {
      x: 36, y: 34, w: 158, h: 296, fontSize: 340, family: '"Barlow Condensed"', weight: 100, dy: 23, dx: 8.5,
      far: { color: "#FF4D00", blur: 50, alpha: 0.55 },
      near: { color: "#FF8C1A", blur: 13, alpha: 0.88 },
      core: { color: "#FFF7E8" },
    },
    rim: { x: 30, y: 352, w: 170, h: 4, radius: 2, grad: [[0, "rgba(255,217,160,0)"], [0.5, "rgba(255,217,160,0.40)"], [1, "rgba(255,217,160,0)"]] },
    shell: { x: 20, y: -32, w: 190, h: 412, tint: [255, 243, 224], rim: 0.55, streak: 0.38, film: 0.05, reflect: 0.14 },
    base: {
      x: 0, y: 358, w: 230, h: 92, radius: [14, 14, 26, 26],
      grad: [[0, "#3A2E20"], [0.28, "#1A130D"], [0.7, "#0C0806"], [1, "#1A1209"]],
      stroke: "rgba(255,255,255,0.086)", strokeWidth: 1.5,
      shading: [[0, "rgba(106,86,58,0.40)"], [0.3, "rgba(0,0,0,0)"], [0.62, "rgba(0,0,0,0)"], [1, "rgba(58,42,26,0.60)"]],
      rim: { x: 4, y: 1, w: 222, h: 2.5, radius: 1.5, grad: [[0, "rgba(255,217,160,0.80)"], [0.22, "rgba(255,217,160,0.07)"], [0.78, "rgba(255,217,160,0.07)"], [1, "rgba(255,217,160,0.80)"]] },
      step: { x: 12, y: 6, w: 206, h: 1.5, grad: [[0, "rgba(255,232,196,0)"], [0.5, "rgba(255,232,196,0.40)"], [1, "rgba(255,232,196,0)"]] },
    },
  },
  colon: {
    w: 56, h: 450,
    halo: { x: -14, y: 138, w: 84, h: 146, color: [255, 122, 26], intensity: 0.26, falloff: 2.4, flicker: 0.18, seed: 3 },
    wires: [
      { x: 17, y: 172, w: 2, h: 246 }, { x: 37, y: 172, w: 2, h: 246 },
      { x: 23.5, y: 214, w: 2, h: 204 }, { x: 30.5, y: 214, w: 2, h: 204 },
    ],
    wireGrad: [[0, "#8A7A5C"], [0.45, "#4A4034"], [1, "#241E18"]],
    bulbs: [{ x: 20, y: 161.9 }, { x: 20, y: 203.9 }],
    bulbGrad: [[0, "#524634"], [0.28, "#241C13"], [0.7, "#0E0A07"], [1, "#17120B"]],
    specular: { x: 23, y: 166, w: 5, h: 8, fill: "rgba(255,255,255,0.24)", blur: 2 },
    electrode: { dx: 7, dy: 4.6, w: 2, h: 9, fill: "#9A8A6A", radius: 1 },
    glow: { dx: -7, dy: -4.9, w: 30, h: 30, color: [255, 106, 26], blur: 10 },
    core: { dx: 4.5, dy: 4.1, w: 7, h: 12, fill: "#FFB86A" },
    foot: {
      x: 11, y: 398, w: 34, h: 46, radius: [5, 5, 12, 12],
      grad: [[0, "#3A2E20"], [0.3, "#1A130D"], [0.72, "#0C0806"], [1, "#1A1209"]],
      shading: [[0, "rgba(106,86,58,0.33)"], [0.32, "rgba(0,0,0,0)"], [0.62, "rgba(0,0,0,0)"], [1, "rgba(58,42,26,0.53)"]],
      rim: { x: 2, y: 1, w: 30, h: 2, radius: 1, grad: [[0, "rgba(255,217,160,0.73)"], [0.28, "rgba(255,217,160,0.07)"], [0.72, "rgba(255,217,160,0.07)"], [1, "rgba(255,217,160,0.73)"]] },
      step: { x: 5, y: 6, w: 24, h: 1, grad: [[0, "rgba(255,232,196,0)"], [0.5, "rgba(255,232,196,0.33)"], [1, "rgba(255,232,196,0)"]] },
    },
  },
};
const GLASS_D = "M0 127a95 95 0 0 1 86.7-94.64c0-4.86 0.5-7.56 1.9-10.16-3-1.8-4.8-4.8-4.8-8.2 0-6.4 5.1-11.8 11.2-11.8 6.1 0 11.2 5.4 11.2 11.8 0 3.4-1.8 6.4-4.8 8.2 1.4 2.6 1.9 5.3 1.9 10.16a95 95 0 0 1 86.7 94.64l0 237a16 16 0 0 1-16 16l-158 0a16 16 0 0 1-16-16z";
const BULB_D = "M8 0.6c1.2 0 1.9 1.1 1.9 2.5 3.3 1.4 5.5 4.5 5.5 8.3 0 4.8-3.3 8.2-7.4 8.2-4.1 0-7.4-3.4-7.4-8.2 0-3.8 2.2-6.9 5.5-8.3 0-1.4 0.7-2.5 1.9-2.5z";
const GLASS_PATH = new Path2D(GLASS_D);
const BULB_PATH = new Path2D(BULB_D);

/* ------------------------------- 基础工具 -------------------------------- */
const Q = new URLSearchParams(location.search);
const STATIC = Q.get("static") === "1";
const ICON_MODE = Q.get("icon") === "1";
const FIXED_T = Q.get("t"), FIXED_D = Q.get("d"), FIXED_W = Q.get("w");

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const rect = (g, x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
function gradV(g, y0, y1, stops, rev) {
  const gr = g.createLinearGradient(0, rev ? y1 : y0, 0, rev ? y0 : y1);
  for (const [p, c] of stops) gr.addColorStop(p, c);
  return gr;
}
function gradH(g, x0, x1, stops) {
  const gr = g.createLinearGradient(x0, 0, x1, 0);
  for (const [p, c] of stops) gr.addColorStop(p, c);
  return gr;
}
/* glow.glsl → 椭圆径向渐变（按元素自身归一化，故用 scale 造椭圆） */
function glowFill(g, cx, cy, rx, ry, color, falloff, alpha, steps) {
  steps = steps || 16;
  g.save();
  g.globalAlpha = alpha === undefined ? 1 : alpha;
  g.translate(cx, cy); g.scale(Math.max(rx, 0.001), Math.max(ry, 0.001));
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  for (let i = 0; i <= steps; i++) {
    const d = i / steps;
    gr.addColorStop(d, rgba(color, Math.pow(Math.max(0, 1 - d), falloff)));
  }
  g.fillStyle = gr;
  g.beginPath(); g.arc(0, 0, 1, 0, 7); g.fill();
  g.restore();
}

/* glass-v2 的高斯高光项：exp(-((x-μ)/σ)²) */
function gaussFill(g, cx, cy, sx, sy, color, alpha, k) {
  k = k || 2.6;
  g.save();
  g.globalAlpha = clamp(alpha, 0, 1);
  g.translate(cx, cy); g.scale(Math.max(sx, 0.001) * k, Math.max(sy, 0.001) * k);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  for (let i = 0; i <= 18; i++) {
    const d = i / 18, t = d * k;
    gr.addColorStop(d, rgba(color, Math.exp(-t * t)));
  }
  g.fillStyle = gr;
  g.beginPath(); g.arc(0, 0, 1, 0, 7); g.fill();
  g.restore();
}

/* mesh.glsl → 逐像素六边形线框（生成一次，六只管复用） */
function buildMesh(w, h, cfg, ss) {
  const W = Math.max(1, Math.round(w * ss)), H = Math.max(1, Math.round(h * ss));
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  const img = g.createImageData(W, H), d = img.data;
  const wire = cfg.wire / cfg.cell;    // 线宽换算到“格”为单位（shader: u_wire / u_cell）
  const R1 = 1.7320508, NRM = 1 / Math.hypot(1, R1);
  const col = cfg.color, span = Math.max(0.05, cfg.vig - 0.25);
  for (let y = 0; y < H; y++) {
    const fy = (y + 0.5) / ss, uy = fy / cfg.cell;
    for (let x = 0; x < W; x++) {
      const fx = (x + 0.5) / ss, ux = fx / cfg.cell;
      const ax = ux - Math.floor(ux) - 0.5, ay = uy - Math.floor(uy / R1) * R1 - 0.8660254;
      const px = ux - 0.5, py = uy - 0.8660254;
      const bx = px - Math.floor(px) - 0.5, by = py - Math.floor(py / R1) * R1 - 0.8660254;
      const da = ax * ax + ay * ay, db = bx * bx + by * by;
      const gx = da < db ? ax : bx, gy = da < db ? ay : by;
      const adx = Math.abs(gx), ady = Math.abs(gy);
      const edge = 0.5 - Math.max((adx + ady * R1) * NRM, adx);
      const wireV = 1 - smooth(edge / wire);
      const coreV = 1 - smooth(edge / (wire * 0.45));
      const nx = (fx / w - 0.5) * 2, ny = (fy / h - 0.5) * 2;
      const vigV = 1 - smooth((Math.hypot(nx, ny) - 0.25) / span);
      const amt = (wireV * (0.13 + 1.05 * vigV) + coreV * 0.30 * vigV) * cfg.gain;
      const i = (y * W + x) * 4;
      d[i] = Math.min(255, col[0] * amt);
      d[i + 1] = Math.min(255, col[1] * amt);
      d[i + 2] = Math.min(255, col[2] * amt);
      d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* -------------------------------- 画布 ---------------------------------- */
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
let S = 1, ox = 0, oy = 0, dpr = 1;

const meshCv = document.createElement("canvas");
const tubeStatic = [], tubeShell = [], colonStatic = [], digitCache = [];
const glowCv = document.createElement("canvas");
const glowG = glowCv.getContext("2d");
const ambCv = document.createElement("canvas");
const ambG = ambCv.getContext("2d");
const haloCv = document.createElement("canvas");
const rimCv = document.createElement("canvas");
const softCv = document.createElement("canvas");
const shellCv = document.createElement("canvas");
const shellMask = new Path2D();
shellMask.addPath(GLASS_PATH, new DOMMatrix().translate(DESIGN.tube.shell.x, DESIGN.tube.shell.y));
let grainTile = null;

/* 时钟横向布局：3 组「两只管」+ 2 个分隔灯，整体居中 */
const GAP = DESIGN.clock.gap;
const TUBE_X = [], COLON_X = [];
{
  let x = (DESIGN.W - (6 * DESIGN.tube.w + 2 * DESIGN.colon.w + 8 * GAP)) / 2;
  for (let p = 0; p < 3; p++) {
    TUBE_X.push(x, x + DESIGN.tube.w + GAP);
    x += 2 * DESIGN.tube.w + GAP;
    if (p < 2) {
      COLON_X.push(x + GAP);
      x += GAP + DESIGN.colon.w + GAP;
    }
  }
}

/* ------------------------------ 图层构建 -------------------------------- */
function strokeBlurred(g, path, color, width, blur, ss) {
  g.save();
  g.filter = `blur(${blur * ss}px)`;
  g.strokeStyle = color;
  g.lineWidth = width;
  g.lineJoin = "round";
  g.stroke(path);
  g.restore();
}

function drawBase(g, b) {
  g.save();
  rect(g, b.x, b.y, b.w, b.h, b.radius); g.clip();
  g.fillStyle = gradV(g, b.y, b.y + b.h, b.grad);
  g.fillRect(b.x, b.y, b.w, b.h);
  g.fillStyle = gradH(g, b.x, b.x + b.w, b.shading);
  g.fillRect(b.x, b.y, b.w, b.h);
  g.fillStyle = gradH(g, b.rim.x, b.rim.x + b.rim.w, b.rim.grad);
  rect(g, b.rim.x, b.rim.y, b.rim.w, b.rim.h, b.rim.radius || 1); g.fill();
  g.fillStyle = gradH(g, b.step.x, b.step.x + b.step.w, b.step.grad);
  g.fillRect(b.step.x, b.step.y, b.step.w, b.step.h);
  g.restore();
  if (b.stroke) {
    g.strokeStyle = b.stroke; g.lineWidth = b.strokeWidth;
    rect(g, b.x, b.y, b.w, b.h, b.radius); g.stroke();
  }
}

function buildTubeStatic(i) {
  const T = DESIGN.tube;
  const ss = clamp(S * dpr, 0.75, 2);
  const W = Math.round(T.w * ss), H = Math.round(T.h * ss);
  tubeStatic[i] = tubeStatic[i] || document.createElement("canvas");
  tubeShell[i] = tubeShell[i] || document.createElement("canvas");
  tubeStatic[i].width = W; tubeStatic[i].height = H;
  tubeShell[i].width = W; tubeShell[i].height = H;

  /* ---- 静态层：玻璃体 → 内阴影 → 玻璃框 → 阳极网 → 底沿 → 底座 ---- */
  const g = tubeStatic[i].getContext("2d");
  g.setTransform(ss, 0, 0, ss, 0, 0);
  g.clearRect(0, 0, T.w, T.h);
  const bodyPath = new Path2D();
  bodyPath.addPath(GLASS_PATH, new DOMMatrix().translate(T.body.x, T.body.y));

  g.save();
  g.fillStyle = gradV(g, T.body.y, T.body.y + T.body.h, T.body.grad);
  g.fill(bodyPath);
  g.clip(bodyPath);
  strokeBlurred(g, bodyPath, T.body.inner.color, T.body.inner.blur * 2, T.body.inner.blur * 0.5, ss);
  g.restore();

  g.strokeStyle = T.frame.stroke;
  g.lineWidth = T.frame.strokeWidth;
  rect(g, T.frame.x, T.frame.y, T.frame.w, T.frame.h, T.frame.radius); g.stroke();

  g.save();
  rect(g, T.mesh.x, T.mesh.y, T.mesh.w, T.mesh.h, T.mesh.radius);
  g.clip();
  g.globalCompositeOperation = "screen";
  g.drawImage(meshCv, T.mesh.x, T.mesh.y, T.mesh.w, T.mesh.h);
  g.restore();

  g.fillStyle = gradH(g, T.rim.x, T.rim.x + T.rim.w, T.rim.grad);
  rect(g, T.rim.x, T.rim.y, T.rim.w, T.rim.h, T.rim.radius); g.fill();

  drawBase(g, T.base);

  /* ---- 玻璃罩反光层（glass-v2.glsl） ---- */
  const sg = tubeShell[i].getContext("2d");
  sg.setTransform(ss, 0, 0, ss, 0, 0);
  sg.clearRect(0, 0, T.w, T.h);
  drawGlassShell(sg, T.shell, ss);
}

/* glass-v2.glsl 移植 */
function drawGlassShell(g, cfg, ss) {
  const W = cfg.w, H = cfg.h, tint = cfg.tint;
  g.save();
  g.translate(cfg.x, cfg.y);
  g.beginPath(); g.rect(0, 0, W, H); g.clip();
  g.globalCompositeOperation = "screen";

  /* 1) 玻璃壁边缘光：rim^1.25 × vmod × lmod */
  rimCv.width = Math.round(W * ss); rimCv.height = Math.round(H * ss);
  const rg = rimCv.getContext("2d");
  rg.setTransform(ss, 0, 0, ss, 0, 0);
  rg.clearRect(0, 0, W, H);
  strokeBlurred(rg, GLASS_PATH, rgba(tint, 1), 22, 8, ss);
  rg.globalCompositeOperation = "destination-in";
  rg.fillStyle = "#ffffff";
  rg.fill(GLASS_PATH);
  rg.globalCompositeOperation = "source-over";
  /* 用 destination-in 乘 alpha 来施加 vmod × lmod 调制
     （注意：multiply 画在透明底上会把整层涂白，是上一版的 bug） */
  rg.globalCompositeOperation = "destination-in";
  rg.fillStyle = gradH(rg, 0, W, [[0, "#ffffffff"], [0.16, "#ffffffff"], [0.88, "#ffffff99"], [1, "#ffffff99"]]);
  rg.fillRect(0, 0, W, H);
  const vstops = [];
  for (let i = 0; i <= 10; i++) {
    const py = i / 10 * H, vy = ((1 - py / H) - 0.72) / 0.58;
    const a = Math.max(0, Math.min(1, (0.20 + 0.95 * Math.exp(-vy * vy)) / 1.15));
    vstops.push([i / 10, `rgba(255,255,255,${a.toFixed(3)})`]);
  }
  rg.fillStyle = gradV(rg, 0, H, vstops);
  rg.fillRect(0, 0, W, H);
  rg.globalCompositeOperation = "source-over";
  g.globalAlpha = cfg.rim;
  g.drawImage(rimCv, 0, 0, W, H);
  g.globalAlpha = 1;

  /* 2) 高斯高光：左侧主光带 / 右侧细光带 / 穹顶双侧 / 排气孔 */
  const streaks = [
    [0.115, 0.44, 0.055, 0.34, 1.00],
    [0.905, 0.46, 0.020, 0.26, 0.45],
    [0.240, 0.85, 0.180, 0.13, 0.60],
    [0.760, 0.86, 0.160, 0.12, 0.32],
    [0.462, 0.955, 0.022, 0.045, 0.85],
  ];
  for (const [ux, uy, sx, sy, k] of streaks) {
    gaussFill(g, ux * W, (1 - uy) * H, sx * W, sy * H, tint, k * cfg.streak);
  }

  /* 3) 壁厚柔光 */
  softCv.width = Math.round(W * ss); softCv.height = Math.round(H * ss);
  const sg2 = softCv.getContext("2d");
  sg2.setTransform(ss, 0, 0, ss, 0, 0);
  sg2.clearRect(0, 0, W, H);
  strokeBlurred(sg2, GLASS_PATH, rgba(tint, 1), 36, 14, ss);
  sg2.globalCompositeOperation = "destination-in";
  sg2.fillStyle = "#ffffff";
  sg2.fill(GLASS_PATH);
  sg2.globalCompositeOperation = "source-over";
  g.globalAlpha = cfg.film;
  g.drawImage(softCv, 0, 0, W, H);
  g.globalAlpha = 1;

  /* 4) 管内暖反射 */
  gaussFill(g, 0.52 * W, (1 - 0.32) * H, 0.28 * W, 0.30 * H, tint, cfg.reflect);

  /* 5) 用「轮廓 + 4px 外扩」做蒙版：保留轮廓上的边缘光，但切掉飘到外面的雾状光 */
  g.globalAlpha = 1;
  g.globalCompositeOperation = "destination-in";
  g.fillStyle = "#ffffff";
  g.fill(GLASS_PATH);
  g.globalCompositeOperation = "source-over";
  g.restore();
}

function buildColonStatic(i) {
  const C = DESIGN.colon;
  const ss = clamp(S * dpr, 0.75, 2);
  colonStatic[i] = colonStatic[i] || document.createElement("canvas");
  colonStatic[i].width = Math.round(C.w * ss);
  colonStatic[i].height = Math.round(C.h * ss);
  const g = colonStatic[i].getContext("2d");
  g.setTransform(ss, 0, 0, ss, 0, 0);
  g.clearRect(0, 0, C.w, C.h);

  for (const w of C.wires) {
    g.fillStyle = gradV(g, w.y, w.y + w.h, C.wireGrad);
    rect(g, w.x, w.y, w.w, w.h, 1.2); g.fill();
  }
  for (const b of C.bulbs) {
    g.save();
    g.translate(b.x, b.y);
    g.fillStyle = gradV(g, 0, 20.2, C.bulbGrad);
    g.fill(BULB_PATH);
    g.restore();
    g.fillStyle = C.electrode.fill;
    rect(g, b.x + C.electrode.dx, b.y + C.electrode.dy, C.electrode.w, C.electrode.h, C.electrode.radius); g.fill();
    g.save();
    g.filter = `blur(${C.specular.blur * ss}px)`;
    g.fillStyle = C.specular.fill;
    g.beginPath(); g.ellipse(b.x + C.specular.x + 2.5, b.y + C.specular.y, 2.5, 4, 0, 0, 7); g.fill();
    g.restore();
    g.fillStyle = C.core.fill;
    g.beginPath(); g.ellipse(b.x + C.core.dx + 3.5, b.y + C.core.dy + 6, 3.5, 6, 0, 0, 7); g.fill();
  }
  drawBase(g, {
    x: C.foot.x, y: C.foot.y, w: C.foot.w, h: C.foot.h, radius: C.foot.radius,
    grad: C.foot.grad, shading: C.foot.shading, rim: C.foot.rim, step: C.foot.step,
  });
}

/* 玻璃罩层：叠加前再按玻璃轮廓裁一次，确保不会有光飘到轮廓外 */
const shellSS = () => clamp(S * dpr, 0.75, 2);
function shellLayer(i) {
  const ss = shellSS();
  const W = Math.round(DESIGN.tube.w * ss), H = Math.round(DESIGN.tube.h * ss);
  if (shellCv.width !== W || shellCv.height !== H) { shellCv.width = W; shellCv.height = H; }
  const g = shellCv.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = "source-over";
  g.globalAlpha = 1;
  g.clearRect(0, 0, W, H);
  g.drawImage(tubeShell[i], 0, 0);
  g.globalCompositeOperation = "destination-in";
  g.setTransform(ss, 0, 0, ss, 0, 0);
  g.fillStyle = "#ffffff";
  g.fill(shellMask);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = "source-over";
  return shellCv;
}

/* 数字层：Glow Far（blur 50 / .55）→ Glow Near（blur 13 / .88）→ Digit */
function renderDigit(i, ch) {
  const D = DESIGN.tube.digit;
  const ss = clamp(S * dpr, 0.75, 2);
  if (!digitCache[i]) digitCache[i] = { ch: null, cv: document.createElement("canvas") };
  const slot = digitCache[i];
  if (slot.ch === ch && slot.ss === ss) return slot.cv;
  const c = slot.cv;
  c.width = Math.round(D.w * ss); c.height = Math.round(D.h * ss);
  const g = c.getContext("2d");
  g.setTransform(ss, 0, 0, ss, 0, 0);
  g.clearRect(0, 0, D.w, D.h);
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.font = `${D.weight} ${D.fontSize}px ${D.family}`;
  const cx = D.w / 2 + (D.dx || 0), cy = D.h / 2 + D.dy;
  g.save(); g.globalAlpha = D.far.alpha; g.filter = `blur(${D.far.blur * ss}px)`;
  g.fillStyle = D.far.color; g.fillText(ch, cx, cy); g.restore();
  g.save(); g.globalAlpha = D.near.alpha; g.filter = `blur(${D.near.blur * ss}px)`;
  g.fillStyle = D.near.color; g.fillText(ch, cx, cy); g.restore();
  g.fillStyle = D.core.color; g.fillText(ch, cx, cy);
  slot.ch = ch; slot.ss = ss;
  return c;
}

/* 环境层：ambient.glsl 拆成「底色+暗角」（静态）与「暖光晕」（按闪烁叠加） */
function buildAmbient() {
  const w = 480, h = 270, B = DESIGN.ambient;
  ambCv.width = haloCv.width = w;
  ambCv.height = haloCv.height = h;
  const g = ambG;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = "source-over";
  g.globalAlpha = 1;
  g.clearRect(0, 0, w, h);
  g.fillStyle = DESIGN.bg; g.fillRect(0, 0, w, h);
  const bstops = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10, v = B.base * (0.55 + 0.9 * (1 - t)) * 255;
    bstops.push([t, `rgb(${v | 0},${v * 0.96 | 0},${v * 0.92 | 0})`]);
  }
  g.fillStyle = gradV(g, 0, h, bstops);
  g.fillRect(0, 0, w, h);
  /* 暗角：col *= mix(0.70, 1.0, smoothstep(1.30, 0.28, len(uv-0.5))) */
  g.save();
  g.translate(0.5 * w, 0.5 * h); g.scale(w * 0.5, h * 0.5);
  const vg = g.createRadialGradient(0, 0, 0.28, 0, 0, 1.30);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(0.55, "rgba(0,0,0,0.12)");
  vg.addColorStop(1, "rgba(0,0,0,0.30)");
  g.fillStyle = vg; g.fillRect(-1.45, -1.45, 2.9, 2.9);
  g.restore();
  /* 暖光晕：exp(-2d)，d = 像素距离 / 1080 */
  const hg = haloCv.getContext("2d");
  hg.setTransform(1, 0, 0, 1, 0, 0);
  hg.clearRect(0, 0, w, h);
  const gr = hg.createRadialGradient(0.5 * w, B.centerY * h, 0, 0.5 * w, B.centerY * h, h * 1.6);
  for (let i = 0; i <= 20; i++) {
    const d = i / 20 * 1.6;
    gr.addColorStop(i / 20, rgba(B.warm, clamp(Math.exp(-2 * d) * B.strength, 0, 1)));
  }
  hg.fillStyle = gr; hg.fillRect(0, 0, w, h);
  /* 颗粒 */
  if (!grainTile) {
    const N = 64, gc = document.createElement("canvas");
    gc.width = gc.height = N;
    const gg = gc.getContext("2d");
    const id = gg.createImageData(N, N);
    for (let i = 0; i < N * N; i++) {
      const v = 128 + (Math.random() - 0.5) * 26;
      id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v;
      id.data[i * 4 + 3] = 255;
    }
    gg.putImageData(id, 0, 0);
    grainTile = gc;
  }
}

/* ------------------------------ 时间与动画 ------------------------------ */
const DAYS = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
let DATE_STR = "10 / 10";
let dayStr = "SATURDAY";
const tubes = TUBE_X.map((_, i) => ({
  cur: "0", to: "0", t: 9, dur: 0.26,
  seed: Math.random() * 97 + i * 13,
  walk: 0, drop: 0, nextDrop: 0.6 + Math.random() * 3.2,
}));

function digitsOf(str) {
  for (let i = 0; i < 6; i++) {
    const d = str[i], st = tubes[i];
    if (st.to !== d) {
      st.cur = st.to; st.to = d; st.t = 0;
      st.dur = STATIC ? 0 : 0.22 + Math.random() * 0.10;
    }
  }
}
function nowStrings() {
  const d = new Date(), p2 = (n) => String(n).padStart(2, "0");
  return {
    time: `${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`,
    date: `${p2(d.getMonth() + 1)} / ${p2(d.getDate())}`,
    day: DAYS[d.getDay()],
  };
}
function tubeFrame(st, T) {
  if (st.t < st.dur) {
    const k = st.t / st.dur;
    if (k < 0.62) {                       /* 起辉：随机跳字 */
      const step = Math.floor(st.t / 0.032);
      const r = Math.abs(Math.sin((step + 1) * 12.9898 + st.seed) * 43758.5453) % 1;
      const d = r < 0.45 ? String(Math.floor(r * 10)) : (r < 0.7 ? st.cur : st.to);
      return { digit: d, alpha: 0.34 + 0.5 * Math.abs(Math.sin(step * 2.7 + st.seed)) };
    }
    const k2 = (k - 0.62) / 0.38;         /* 落定：过亮后回落 */
    return { digit: st.to, alpha: 1 + 0.45 * Math.pow(1 - k2, 2) };
  }
  if (STATIC) return { digit: st.to, alpha: 1 };
  let a = 1 + st.walk * 0.075;            /* 常驻忽明忽暗 */
  a *= 0.985 + 0.015 * Math.sin(T * 31 + st.seed) * Math.sin(T * 7.3 + st.seed);
  if (st.drop > 0) a *= 0.42 + 0.38 * Math.random();
  return { digit: st.to, alpha: a };
}
/* glow.glsl 的闪烁项 */
function flickerOf(T, seed, amt, speed) {
  const t = T * (speed || 1.6) + seed * 13.7;
  return 1 + amt * 0.55 * Math.sin(t) + amt * 0.30 * Math.sin(t * 2.7 + 1.3) + amt * 0.18 * Math.sin(t * 6.1 + 0.7);
}

/* -------------------------------- 主循环 -------------------------------- */
let last = performance.now(), acc = 1;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const T = now / 1000;

  if (!STATIC) {
    acc += dt;
    if (acc >= 0.25) {
      acc = 0;
      const s = nowStrings();
      digitsOf(s.time);
      if (!FIXED_D) DATE_STR = s.date;
      if (!FIXED_W) dayStr = s.day;
    }
    for (const st of tubes) {
      st.t += dt;
      st.walk += (Math.random() - 0.5) * 0.55; st.walk *= 0.90;
      st.nextDrop -= dt;
      if (st.drop <= 0 && st.nextDrop <= 0) {
        st.drop = 0.035 + Math.random() * 0.09;
        st.nextDrop = 0.7 + Math.random() * 3.6;
      }
      if (st.drop > 0) st.drop = Math.max(0, st.drop - dt);
    }
  } else {
    for (const st of tubes) st.t = 9;
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.fillStyle = DESIGN.bg;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(S, 0, 0, S, ox, oy);

  /* 1) 环境底 + 暖光晕（闪烁只作用在光晕上） */
  ctx.drawImage(ambCv, 0, 0, DESIGN.W, DESIGN.H);
  const ambFlick = STATIC ? 1 : (0.90 + 0.062 * Math.sin(T * 1.27) + 0.032 * Math.sin(T * 3.13 + 1.7) + 0.018 * Math.sin(T * 7.31 + 0.4));
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = clamp(ambFlick, 0, 1.4);
  ctx.drawImage(haloCv, 0, 0, DESIGN.W, DESIGN.H);
  ctx.restore();

  /* 2) 低分辨率柔光层：地面光池 + 管光晕 + 分隔灯 */
  const gw = glowCv.width, gh = glowCv.height, gs = DESIGN.W / gw;
  glowG.setTransform(1, 0, 0, 1, 0, 0);
  glowG.globalCompositeOperation = "source-over";
  glowG.globalAlpha = 1;
  glowG.clearRect(0, 0, gw, gh);
  glowG.globalCompositeOperation = "lighter";
  glowG.save();
  glowG.scale(1 / gs, 1 / gs);

  const pool = DESIGN.pool;
  glowFill(glowG, pool.x + pool.w / 2, pool.y + pool.h / 2, pool.w / 2, pool.h / 2, pool.color, pool.falloff,
    pool.intensity * (STATIC ? 1 : flickerOf(T, pool.seed, pool.flicker)));

  const TH = DESIGN.tube.halo;
  for (let i = 0; i < 6; i++) {
    glowFill(glowG, TUBE_X[i] + DESIGN.tube.w / 2, DESIGN.clock.y + DESIGN.tube.h / 2,
      DESIGN.tube.w / 2, DESIGN.tube.h / 2, TH.color, TH.falloff,
      TH.intensity * (STATIC ? 1 : flickerOf(T, TH.seed + i * 0.7, TH.flicker)));
  }
  const CH = DESIGN.colon.halo;
  for (let i = 0; i < 2; i++) {
    glowFill(glowG, COLON_X[i] + CH.x + CH.w / 2, DESIGN.clock.y + CH.y + CH.h / 2, CH.w / 2, CH.h / 2,
      CH.color, CH.falloff, CH.intensity * (STATIC ? 1 : flickerOf(T, CH.seed + i, CH.flicker)));
  }
  for (let i = 0; i < 2; i++) {
    for (const b of DESIGN.colon.bulbs) {
      const G = DESIGN.colon.glow;
      const f = STATIC ? 1 : flickerOf(T, 1.7 + i * 3.1, CH.flicker, 2.1);
      glowFill(glowG, COLON_X[i] + b.x + G.dx + G.w / 2, DESIGN.clock.y + b.y + G.dy + G.h / 2,
        G.w * 0.8, G.h * 0.8, G.color, 2.2, 0.75 * f, 12);
    }
  }
  glowG.restore();
  ctx.save();
  ctx.globalCompositeOperation = "screen";          // Halo / Light Pool 在设计中均为 screen
  ctx.drawImage(glowCv, 0, 0, gw, gh, 0, 0, DESIGN.W, DESIGN.H);
  ctx.restore();

  /* 3) 逐管：静态层 → 数字 → 玻璃反光 */
  const TD = DESIGN.tube;
  for (let i = 0; i < 6; i++) {
    const { digit, alpha } = tubeFrame(tubes[i], T);
    ctx.drawImage(tubeStatic[i], TUBE_X[i], DESIGN.clock.y, TD.w, TD.h);
    const dCv = renderDigit(i, digit);
    ctx.save();
    ctx.globalCompositeOperation = "source-over";   // 设计稿：数字为普通混合
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.drawImage(dCv, TUBE_X[i] + TD.digit.x, DESIGN.clock.y + TD.digit.y, TD.digit.w, TD.digit.h);
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation = "screen";        // 设计稿：Glass Shell blendMode = screen
    ctx.drawImage(shellLayer(i), TUBE_X[i], DESIGN.clock.y, TD.w, TD.h);
    ctx.restore();
  }

  /* 4) 分隔灯 */
  for (let i = 0; i < 2; i++) {
    ctx.drawImage(colonStatic[i], COLON_X[i], DESIGN.clock.y, DESIGN.colon.w, DESIGN.colon.h);
    const f = STATIC ? 1 : flickerOf(T, 1.7 + i * 3.1, DESIGN.colon.halo.flicker, 2.1);
    for (const b of DESIGN.colon.bulbs) {
      const G = DESIGN.colon.glow;
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      glowFill(ctx, COLON_X[i] + b.x + G.dx + G.w / 2, DESIGN.clock.y + b.y + G.dy + G.h / 2,
        G.w * 0.8, G.h * 0.8, [255, 150, 60], 2.2, 0.55 * f, 12);
      ctx.restore();
    }
  }

  /* 5) 日期 */
  drawDate(ctx);

  /* 6) 颗粒 */
  if (!STATIC && grainTile) {
    ctx.save();
    ctx.globalAlpha = 0.016;
    const wob = Math.floor(T * 22) % 64;
    ctx.fillStyle = ctx.createPattern(grainTile, "repeat");
    ctx.translate(-wob, -wob);
    ctx.fillRect(0, 0, DESIGN.W + 64, DESIGN.H + 64);
    ctx.restore();
  }

  requestAnimationFrame(tick);
}

function drawDate(g) {
  const D = DESIGN.date;
  const hasLS = "letterSpacing" in g;
  g.save();
  g.textBaseline = "middle";
  g.textAlign = "left";
  const wOf = (txt, font, ls) => {
    g.font = font;
    if (hasLS) g.letterSpacing = `${D.spacing}px`;
    return g.measureText(txt).width + (hasLS ? 0 : Math.max(0, txt.length - 1) * ls);
  };
  const fDay = `400 ${D.fontSize}px "Inter", system-ui, sans-serif`;
  const fWeek = `500 ${D.fontSize}px "Inter", system-ui, sans-serif`;
  const wDay = wOf(DATE_STR, fDay, D.spacing);
  const wWeek = wOf(dayStr, fWeek, D.spacing);
  const total = wDay + D.gap + D.dotSize + D.gap + wWeek;
  let x = (DESIGN.W - total) / 2;
  const cy = D.y + 15;
  g.fillStyle = D.fill;
  g.font = fDay;
  if (hasLS) g.letterSpacing = `${D.spacing}px`;
  g.fillText(DATE_STR, x, cy);
  x += wDay + D.gap;
  g.beginPath(); g.arc(x + D.dotSize / 2, cy, D.dotSize / 2, 0, 7);
  g.fillStyle = D.dotFill; g.fill();
  x += D.dotSize + D.gap;
  g.font = fWeek;
  if (hasLS) g.letterSpacing = `${D.spacing}px`;
  g.fillStyle = D.fill;
  g.fillText(dayStr, x, cy);
  if (hasLS) g.letterSpacing = "0px";
  g.restore();
}

/* -------------------------------- 尺寸 --------------------------------- */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  cv.width = Math.round(vw * dpr);
  cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px";
  cv.style.height = vh + "px";
  if (ICON_MODE) {
    /* 图标模式：单只管子特写；icon=2 为 maskable（更小的主体，留安全边距） */
    S = Math.min(cv.width, cv.height) / (Q.get("icon") === "2" ? 360 : 300);
    const ci = 4;
    ox = cv.width / 2 - (TUBE_X[ci] + DESIGN.tube.w / 2) * S;
    oy = cv.height / 2 - (DESIGN.clock.y + 205) * S;
  } else {
    S = Math.min(cv.width / DESIGN.W, cv.height / DESIGN.H);
    ox = (cv.width - DESIGN.W * S) / 2;
    oy = (cv.height - DESIGN.H * S) / 2;
  }
  glowCv.width = Math.max(1, Math.round(DESIGN.W / 3));
  glowCv.height = Math.max(1, Math.round(DESIGN.H / 3));
  const ss = clamp(S * dpr, 1, 2);
  const m = DESIGN.tube.mesh;
  const src = buildMesh(m.w, m.h, m, ss);
  meshCv.width = src.width; meshCv.height = src.height;
  const mg = meshCv.getContext("2d");
  mg.clearRect(0, 0, meshCv.width, meshCv.height);
  mg.drawImage(src, 0, 0);
  for (let i = 0; i < 6; i++) { digitCache[i] = null; buildTubeStatic(i); }
  for (let i = 0; i < 2; i++) buildColonStatic(i);
  buildAmbient();
}

/* -------------------------------- 启动 --------------------------------- */
window.addEventListener("resize", resize);
applyFixed();
resize();
if (FIXED_T) DATE_STR = `${FIXED_T.split(":")[0].padStart(2, "0")} / ${FIXED_T.split(":")[1].padStart(2, "0")}`;
else {
  const s0 = nowStrings();
  digitsOf(s0.time);
  DATE_STR = s0.date; dayStr = s0.day;
}
function applyFixed() {
  if (FIXED_T) {
    const parts = FIXED_T.split(":").map((v) => String(parseInt(v, 10) || 0).padStart(2, "0"));
    while (parts.length < 3) parts.push("00");
    digitsOf(parts.join(""));
  }
  if (FIXED_D) DATE_STR = FIXED_D;
  if (FIXED_W) dayStr = FIXED_W.toUpperCase();
}
document.fonts.ready.then(() => { for (let i = 0; i < 6; i++) digitCache[i] = null; });
requestAnimationFrame(tick);

/* ------------------------------- PWA ----------------------------------- */
const installBtn = document.getElementById("install");
const hint = document.getElementById("hint");
let deferredPrompt = null;
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

if (ICON_MODE) {
  installBtn.style.display = "none";
} else if (!isStandalone()) {
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add("show");
  });
  setTimeout(() => { if (!isStandalone()) installBtn.classList.add("show"); }, 2200);
  installBtn.addEventListener("click", async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const res = await deferredPrompt.userChoice;
      if (res && res.outcome === "accepted") installBtn.classList.remove("show");
      deferredPrompt = null;
      return;
    }
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
    hint.textContent = ios
      ? "在 Safari 中点击「分享」→「添加到主屏幕」，即可把时钟装到桌面。"
      : "在浏览器菜单中选择「安装应用 / 添加到主屏幕」，即可把时钟装到桌面。";
    hint.classList.add("show");
    setTimeout(() => hint.classList.remove("show"), 6500);
  });
  window.addEventListener("appinstalled", () => installBtn.classList.remove("show"));
}
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
